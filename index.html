<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>s0k1x</title>
  <meta name="description" content="s0k1x — desarrollador y creador. Cada proyecto es un mundo." />
  <meta name="theme-color" content="#F4F3EF" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23111'/%3E%3Ccircle cx='24' cy='34' r='5' fill='%23fff'/%3E%3Ccircle cx='40' cy='34' r='5' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <!-- ================= HOME ================= -->
  <div class="home" id="home">
    <header class="bar">
      <button class="brand" data-go="top">s0k1x</button>
      <nav class="bar-links">
        <button data-go="mundos">Mundos</button>
        <button data-go="sobre">Sobre mí</button>
        <button data-go="contacto">Contacto</button>
        <button class="theme" id="theme" aria-label="Cambiar tema"><span></span></button>
      </nav>
    </header>

    <section class="hero" id="top">
      <div class="hero-text">
        <p class="eyebrow mono"><span class="live"></span><span id="status"></span></p>
        <h1 class="title" id="title">Construyo pequeños <em>mundos</em> en internet.</h1>
        <p class="lede" id="lede"></p>
        <button class="cta" data-go="mundos">Explorar mundos <span class="cta-arrow">↓</span></button>
      </div>
      <div class="stage" id="heroStage">
        <div class="horizon"></div>
      </div>
    </section>

    <section class="block" id="mundos">
      <div class="block-head">
        <h2 class="h2">Mundos <span class="count mono" id="count"></span></h2>
        <p class="muted">Cada proyecto es un lugar distinto. Entra en uno.</p>
      </div>
      <ol class="worlds" id="worldList"></ol>
    </section>

    <section class="block" id="sobre">
      <div class="block-head"><h2 class="h2">Sobre mí</h2></div>
      <div class="about">
        <p class="about-big" id="aboutBig"></p>
        <dl class="facts" id="facts"></dl>
      </div>
    </section>

    <section class="block contact" id="contacto">
      <div class="block-head"><h2 class="h2">Contacto</h2></div>
      <p class="contact-big">¿Tienes una idea? <em>Escríbeme.</em></p>
      <button class="mail" id="mail"><span id="mailText"></span><span class="mail-tag mono" id="mailTag">copiar</span></button>
      <ul class="socials" id="socials"></ul>
    </section>

    <footer class="foot mono">
      <span>© <span id="year"></span> s0k1x</span>
      <span class="muted">pulsa al personaje · escribe <kbd>s0k1x</kbd></span>
    </footer>

    <div class="preview" id="preview" aria-hidden="true"></div>
  </div>

  <!-- ================= WORLD ================= -->
  <div class="world" id="world" hidden>
    <header class="world-bar">
      <button class="w-btn" id="wBack">← s0k1x</button>
      <span class="mono w-count" id="wCount"></span>
      <div class="w-nav">
        <button class="w-btn" id="wPrev" aria-label="Mundo anterior">←</button>
        <button class="w-btn" id="wNext" aria-label="Mundo siguiente">→</button>
      </div>
    </header>
    <section class="w-stage">
      <div class="w-scene" id="wScene"></div>
      <div class="w-buddy" id="wBuddy"></div>
      <div class="w-info">
        <p class="mono w-kicker" id="wKicker"></p>
        <h1 class="w-title" id="wTitle"></h1>
        <p class="w-desc" id="wDesc"></p>
        <div class="w-meta mono" id="wMeta"></div>
        <div class="w-actions" id="wActions"></div>
      </div>
      <button class="w-scroll mono" id="wScroll">leer más ↓</button>
    </section>
    <section class="w-readme">
      <div class="w-readme-inner">
        <p class="mono w-kicker">README</p>
        <article class="md" id="wReadme"></article>
      </div>
    </section>
  </div>

  <div class="portal" id="portal" aria-hidden="true"></div>
</body>
</html>
