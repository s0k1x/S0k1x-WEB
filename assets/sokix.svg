<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="sokix-t sokix-d">
  <title id="sokix-t">Sokix</title>
  <desc id="sokix-d">Aparición etérea: silueta blanca y luminosa con cabeza de púas, ojos entrecerrados oscuros y una sonrisa enorme con dos colmillos, flotando sobre fondo negro.</desc>
  <!--
    RIG · piezas con id y pivote (coordenadas del viewBox 400×400, transform-box: view-box)
      #sokix   figura completa (flotar)    200 240
      #arm-l   brazo izquierdo             116 252
      #arm-r   brazo derecho               284 252
      #eye-l / #eye-r  (scaleY = parpadeo) 158 180 / 242 180
      #mouth   sonrisa                     200 238
      #halo    resplandor (opacidad/escala) 200 210
  -->
  <defs>
    <!-- resplandor: halo ancho + halo cercano + figura -->
    <filter id="sx-glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="far"/>
      <feFlood flood-color="#ffffff" flood-opacity=".55"/>
      <feComposite in2="far" operator="in" result="farGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="near"/>
      <feFlood flood-color="#ffffff" flood-opacity=".9"/>
      <feComposite in2="near" operator="in" result="nearGlow"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="soft"/>
      <feMerge>
        <feMergeNode in="farGlow"/>
        <feMergeNode in="nearGlow"/>
        <feMergeNode in="soft"/>
      </feMerge>
    </filter>
    <filter id="sx-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="sx-blur-far" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <radialGradient id="sx-body" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf5"/>
    </radialGradient>
    <radialGradient id="sx-mouth" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3a3b44"/>
      <stop offset=".6" stop-color="#1e1f26"/>
      <stop offset="1" stop-color="#111116"/>
    </radialGradient>

    <path id="sx-eye-l-shape" d="M122 160 C146 162 170 168 190 178 C188 190 176 196 162 194 C144 191 130 178 122 160 Z"/>
    <path id="sx-mouth-shape" d="M112 196 Q200 232 288 196 Q270 272 200 278 Q130 272 112 196 Z"/>
    <clipPath id="sx-mouth-c"><use href="#sx-mouth-shape"/></clipPath>

    <style>
      #sokix * { transform-box: view-box; }
      .w { fill: url(#sx-body); }

      /* idle (borra este bloque si lo quieres estático) */
      #sokix { transform-origin: 200px 240px; animation: sx-float 3.2s ease-in-out infinite; }
      #arm-l { transform-origin: 116px 252px; animation: sx-arm-l 3.2s ease-in-out infinite; }
      #arm-r { transform-origin: 284px 252px; animation: sx-arm-r 3.2s ease-in-out infinite; }
      #eye-l { transform-origin: 158px 180px; animation: sx-blink 5s infinite; }
      #eye-r { transform-origin: 242px 180px; animation: sx-blink 5s infinite; }
      #mouth { transform-origin: 200px 238px; animation: sx-grin 3.2s ease-in-out infinite; }
      #halo  { transform-origin: 200px 210px; animation: sx-halo 3.2s ease-in-out infinite; }
      @keyframes sx-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes sx-arm-l { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg); } }
      @keyframes sx-arm-r { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-7deg); } }
      @keyframes sx-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.15); } }
      @keyframes sx-grin  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03, .97); } }
      @keyframes sx-halo  { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: .8; transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) { #sokix, #sokix * { animation: none !important; } }
    </style>
  </defs>

  <rect width="400" height="400" fill="#000"/>

  <g id="sokix">
    <!-- halo lejano que se funde con el fondo -->
    <ellipse id="halo" cx="200" cy="205" rx="150" ry="140" fill="#ffffff" opacity=".6" filter="url(#sx-blur-far)"/>

    <!-- silueta blanca (todas las piezas se funden en una sola forma) -->
    <g id="silhouette" filter="url(#sx-glow)">
      <!-- brazos cortos y gruesos, levantados hacia fuera -->
      <g id="arm-l" class="w">
        <path d="M130 228 C110 220 86 200 70 178 L40 202 C62 232 96 262 126 280 Z"/>
        <path d="M56 160 C72 158 84 172 82 188 C80 206 64 214 50 212 C36 210 28 198 30 184 C32 170 42 161 56 160 Z"/>
      </g>
      <g id="arm-r" class="w">
        <path d="M270 228 C290 220 314 200 330 178 L360 202 C338 232 304 262 274 280 Z"/>
        <path d="M344 160 C328 158 316 172 318 188 C320 206 336 214 350 212 C364 210 372 198 370 184 C368 170 358 161 344 160 Z"/>
      </g>

      <g class="w">
        <!-- torso hinchado, termina en punta suave (flota) -->
        <path d="M200 340 C178 326 116 306 106 256 C98 214 118 186 140 172 L260 172 C282 186 302 214 294 256 C284 306 222 326 200 340 Z"/>
        <!-- cabeza ancha y plana -->
        <path d="M110 178 C106 140 130 116 200 114 C270 116 294 140 290 178 C288 204 252 220 200 220 C148 220 112 204 110 178 Z"/>
        <!-- dos púas principales, inclinadas hacia fuera -->
        <path d="M128 136 Q118 92 106 34 Q148 74 182 120 Z"/>
        <path d="M272 136 Q282 92 294 34 Q252 74 218 120 Z"/>
        <!-- púa central pequeña -->
        <path d="M184 118 L200 88 L216 118 Z"/>
        <!-- púas laterales horizontales -->
        <path d="M118 132 L54 118 L112 160 Z"/>
        <path d="M110 158 L40 168 L110 190 Z"/>
        <path d="M282 132 L346 118 L288 160 Z"/>
        <path d="M290 158 L360 168 L290 190 Z"/>
        <!-- protuberancias traseras-inferiores -->
        <path d="M114 192 L76 206 L114 214 Z"/>
        <path d="M286 192 L324 206 L286 214 Z"/>
      </g>
    </g>

    <!-- ojos entrecerrados, sólidos, sin pupila -->
    <g filter="url(#sx-soft)" fill="#16161b">
      <g id="eye-l"><use href="#sx-eye-l-shape"/></g>
      <g id="eye-r"><use href="#sx-eye-l-shape" transform="translate(400 0) scale(-1 1)"/></g>
    </g>

    <!-- sonrisa exagerada con dos colmillos -->
    <g id="mouth" filter="url(#sx-soft)">
      <use href="#sx-mouth-shape" fill="url(#sx-mouth)"/>
      <g clip-path="url(#sx-mouth-c)" fill="#b9bdc8">
        <path d="M142 200 L158 248 L174 206 Z"/>
        <path d="M258 200 L242 248 L226 206 Z"/>
      </g>
      <!-- labio superior grueso y redondeado -->
      <path d="M112 196 Q200 232 288 196" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".9"/>
    </g>
  </g>
</svg>
